[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio
asyncio_mode = auto

# Coverage
addopts = 
    --cov=app
    --cov-report=xml
    --cov-report=html
    --cov-report=term-missing
    --cov-branch
    --cov-fail-under=50
    --strict-markers

# Exclude coverage for certain files
[coverage:run]
omit =
    */tests/*
    */site-packages/*
    */__pycache__/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
