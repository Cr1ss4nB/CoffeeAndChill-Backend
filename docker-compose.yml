services:
  db:
    image: postgres:15-alpine
    container_name: coffee_chill_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    profiles:
      - localdb
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: coffee_chill_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee_chill_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /app/media
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost,http://localhost:80,http://localhost:5173,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:5173}
    # volumes:
    #   - .:/app
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\"" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../CoffeeAndChill-Frontend
      dockerfile: Dockerfile
    container_name: coffee_chill_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - frontend

  # Ejecuta datos de prueba: docker compose run --rm seed
  # (perfil "seed" para no arrancar con "docker compose up" solo)
  seed:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coffee_chill_seed
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
    networks:
      - app-network
    command: python scripts/seed.py
    restart: "no"
    profiles:
      - seed

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  media_data:
