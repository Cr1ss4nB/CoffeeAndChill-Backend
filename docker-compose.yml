services:
  db:
    image: postgres:15-alpine
    container_name: coffee_chill_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=coffee_chill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: coffee_chill_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/coffee_chill
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data:
