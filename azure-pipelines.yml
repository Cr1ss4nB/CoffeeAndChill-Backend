# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
  - main
  - develop
  - feature/*

pr:
  - main
  - develop

resources:
  repositories:
    - repository: frontend
      type: github
      name: Cr1ss4nB/CoffeeAndChill-Frontend
      endpoint: Cr1ss4nB
      trigger:
        branches:
          include:
            - main
            - develop
            - feature/*

pool:
  vmImage: "ubuntu-latest"

variables:
  backendImageName: "coffee-chill-backend"
  frontendImageName: "coffee-chill-frontend"
  dockerHubRepo: "$(DOCKER_HUB_USERNAME)"
  backendPath: "CoffeeAndChill-Backend"
  frontendPath: "CoffeeAndChill-Frontend"

stages:
  # ---------------- TEST & SONARQUBE ----------------
  - stage: TestAndSonar
    displayName: "Execute Tests and Sonar Analysis"
    jobs:
      - job: TestBackend
        displayName: "Backend: Pytest + Sonar"
        steps:
          - checkout: self
            path: $(backendPath)
            fetchDepth: 0 # Obligatorio para que Sonar compare el historial de git

          - task: UsePythonVersion@0
            inputs:
              versionSpec: "3.11"

          # Instalamos dependencias y corremos pruebas generando reporte XML de cobertura
          - script: |
              cd $(Pipeline.Workspace)/$(backendPath)
              pip install -r requirements.txt
              pip install fakeredis pytest pytest-cov
              pytest --cov=. --cov-report=xml --cov-fail-under=70
            displayName: "Run pytest with XML coverage"

          # Preparamos el escáner de SonarCloud para Python
          - task: SonarCloudPrepare@3
            inputs:
              SonarCloud: "sonarcloud-connection" # Nombre del Service Connection en Azure
              organization: "tu-organizacion-sonar"
              scannerMode: "CLI"
              configMode: "manual"
              cliProjectKey: "coffee-chill-backend"
              cliProjectName: "Coffee and Chill Backend"
              cliSources: "$(Pipeline.Workspace)/$(backendPath)"
              extraProperties: |
                sonar.exclusions=**/tests/**,**/venv/**
                sonar.python.coverage.reportPaths=$(Pipeline.Workspace)/$(backendPath)/coverage.xml

          - task: SonarCloudAnalyze@3
            displayName: "Run SonarCloud Analysis"

          - task: SonarCloudPublish@3
            inputs:
              pollingTimeoutSec: "300"

      - job: TestFrontend
        displayName: "Frontend: Vitest + Sonar"
        steps:
          - checkout: frontend
            path: $(frontendPath)
            fetchDepth: 0

          - task: NodeTool@0
            inputs:
              versionSpec: "20.x"

          # Obligatorio para frontend: instalar la herramienta del escáner en el agente
          - task: SonarCloudPrepare@3
            inputs:
              SonarCloud: "sonarcloud-connection"
              organization: "tu-organizacion-sonar"
              scannerMode: "CLI"
              configMode: "manual"
              cliProjectKey: "coffee-chill-frontend"
              cliProjectName: "Coffee and Chill Frontend"
              cliSources: "$(Pipeline.Workspace)/$(frontendPath)/src"
              extraProperties: |
                sonar.tests=$(Pipeline.Workspace)/$(frontendPath)/src
                sonar.test.inclusions=**/*.test.tsx,**/*.test.ts,**/*.spec.tsx,**/*.spec.ts
                sonar.exclusions=**/node_modules/**,**/dist/**
                sonar.javascript.lcov.reportPaths=$(Pipeline.Workspace)/$(frontendPath)/coverage/lcov.info

          # Vitest DEBE generar formato lcov. Asegúrate que en tu vite.config o vitest.config
          # esté configurado: coverage: { reporter: ['text', 'lcov'] }
          - script: |
              cd $(Pipeline.Workspace)/$(frontendPath)
              npm ci
              npx vitest run --coverage --reporter=verbose
            displayName: "Run vitest and generate LCOV"

          - task: SonarCloudAnalyze@3
            displayName: "Run SonarCloud Analysis"

          - task: SonarCloudPublish@3
            inputs:
              pollingTimeoutSec: "300"

  # ---------------- BUILD ----------------
  - stage: Build
    dependsOn: TestAndSonar
    jobs:
      - job: BuildImages
        steps:
          - checkout: self
            path: $(backendPath)

          - checkout: frontend
            path: $(frontendPath)

          - script: |
              docker build -t $(dockerHubRepo)/$(backendImageName):latest \
                           -t $(dockerHubRepo)/$(backendImageName):$(Build.BuildId) \
                           $(Pipeline.Workspace)/$(backendPath)

              docker build -t $(dockerHubRepo)/$(frontendImageName):latest \
                           -t $(dockerHubRepo)/$(frontendImageName):$(Build.BuildId) \
                           $(Pipeline.Workspace)/$(frontendPath)
            displayName: "Build Docker images"

  # ---------------- PUSH ----------------
  - stage: Push
    dependsOn: Build
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/develop'))
    jobs:
      - job: PushImages
        steps:
          - task: Docker@2
            displayName: "Login to Docker Hub"
            inputs:
              command: "login"
              containerRegistry: "dockerhub-conn"

          - script: |
              docker push $(dockerHubRepo)/$(backendImageName):latest
              docker push $(dockerHubRepo)/$(backendImageName):$(Build.BuildId)

              docker push $(dockerHubRepo)/$(frontendImageName):latest
              docker push $(dockerHubRepo)/$(frontendImageName):$(Build.BuildId)
            displayName: "Push images"
