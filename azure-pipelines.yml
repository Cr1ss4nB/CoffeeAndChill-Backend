# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main
- develop

pr:
- main
- develop

resources:
  repositories:
    - repository: frontend
      type: git
      name: frontend-coffe-and-chill

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self
- checkout: frontend

# Backend tests
- task: Maven@3
  inputs:
    mavenPomFile: 'backend/pom.xml'
    goals: 'clean test'

# Node install
- task: NodeTool@0
  inputs:
    versionSpec: '18.x'

# Frontend tests
- script: |
    cd frontend
    npm install
    npm test